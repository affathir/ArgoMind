# ─────────────────────────────────────────────────────────────────────────────
#  ArgoMind — Smart Farming IoT Dashboard
#  Full-stack Docker Compose setup:
#    • db        — PostgreSQL 15
#    • mqtt      — Eclipse Mosquitto MQTT broker
#    • backend   — FastAPI / Python 3.11
#    • frontend  — Next.js 14
#
#  Quick start:
#    1. cp .env.docker.example .env
#    2. Fill in your API keys inside .env
#    3. docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: argomind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       argomind
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT:-5432}:5432"

  # ── Mosquitto MQTT Broker ───────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: argomind_mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argomind_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL:  postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/argomind
      MQTT_BROKER:   mqtt
      MQTT_PORT:     "1883"
    volumes:
      # Persist ML models and LLM response logs across restarts
      - backend_storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points the browser at the backend.
        # Change to your server's public IP / domain when deploying.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: argomind_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

# ── Named Volumes ───────────────────────────────────────────────────────────
volumes:
  db_data:
  mqtt_data:
  backend_storage:
