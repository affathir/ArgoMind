# =============================================================================
#  AgriMind – Nginx reverse proxy configuration
#  Routes:
#    /          → frontend:3000  (Next.js dashboard)
#    /api/*     → backend:4000   (Express API)
#    /health    → backend:4000
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    # ── Server block ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Backend API ───────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE-specific: disable buffering so tokens stream immediately
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;
        }

        # ── Health endpoint (direct to backend) ───────────────────────────────
        location /health {
            proxy_pass         http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── Next.js static assets (_next/) ────────────────────────────────────
        location /_next/static/ {
            proxy_pass         http://frontend_upstream;
            proxy_cache_valid  200 1d;
            add_header         Cache-Control "public, max-age=86400, immutable";
        }

        # ── Everything else → Next.js frontend ───────────────────────────────
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
